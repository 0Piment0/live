<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080;
const NICK = P.get('nick') || 'SHZ4TW';
const RED = new THREE.Color(P.get('color') || '#ff1a2e');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050507);
scene.fog = new THREE.FogExp2(0x050507, 0.06);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 200);

// --- text ---
const ttf = await new Promise((res, rej) => new TTFLoader().load('./Anton.ttf', res, undefined, rej));
const font = new Font(ttf);
const geo = new TextGeometry(NICK, {
  font, size: 1.2, depth: 0.42, curveSegments: 10,
  bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.022, bevelSegments: 4,
});
geo.computeBoundingBox();
const bb = geo.boundingBox;
geo.translate(-(bb.max.x + bb.min.x) / 2, -bb.min.y, -(bb.max.z + bb.min.z) / 2);
const TEXT_W = bb.max.x - bb.min.x, TEXT_H = bb.max.y - bb.min.y;

const faceMat = new THREE.MeshStandardMaterial({ color: 0x15161a, metalness: 0.95, roughness: 0.28 });
const sideMat = new THREE.MeshStandardMaterial({ color: 0x220306, metalness: 0.6, roughness: 0.35, emissive: RED, emissiveIntensity: 0.0 });
const text = new THREE.Mesh(geo, [faceMat, sideMat]);
scene.add(text);

// reflection of the text on the floor (cheap mirror: flipped, darkened copy)
const reflFace = faceMat.clone(), reflSide = sideMat.clone();
for (const m of [reflFace, reflSide]) { m.transparent = true; m.opacity = 0.18; }
const refl = new THREE.Mesh(geo, [reflFace, reflSide]);
refl.scale.y = -1;
scene.add(refl);

// floor
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80),
  new THREE.MeshLambertMaterial({ color: 0x0a0a0c, transparent: true, opacity: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.001;
scene.add(floor);

// floor grid lines in red, fading out
const grid = new THREE.GridHelper(60, 60, RED, RED);
grid.material.transparent = true; grid.material.opacity = 0.10; grid.material.depthWrite = false;
grid.position.y = 0.002;
scene.add(grid);

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.05));
const keyRed = new THREE.PointLight(RED, 30, 14, 1.8); keyRed.position.set(2.0, 3.4, 3.2); scene.add(keyRed);
const keyRed2 = new THREE.PointLight(RED, 22, 14, 1.8); keyRed2.position.set(-4, 1.5, -1.5); scene.add(keyRed2);
const rim = new THREE.DirectionalLight(0xffffff, 2.2); rim.position.set(0, 4, -6); scene.add(rim);
const sweep = new THREE.PointLight(0xffffff, 0, 6, 1.5); scene.add(sweep);
const front = new THREE.DirectionalLight(0xffe6e6, 0); front.position.set(0, 1.5, 8); scene.add(front);

// embers
const N = 900, ePos = new Float32Array(N * 3), seeds = [];
let s = 1234567; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < N; i++) seeds.push([rnd() * 24 - 12, rnd() * 6, rnd() * 16 - 10, 0.2 + rnd() * 0.6, rnd() * 6.28]);
const eGeo = new THREE.BufferGeometry(); eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
const embers = new THREE.Points(eGeo, new THREE.PointsMaterial({
  color: RED.clone().lerp(new THREE.Color(0xffaa66), 0.35), size: 0.035, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(embers);

// post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.55, 0.62);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// --- timeline (seconds) ---
const T_LOCK = 2.6;      // camera locks frontal + impact
const DUR = 4.0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutQuint = x => 1 - Math.pow(1 - x, 5);
const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const lerp = (a, b, k) => a + (b - a) * k;

window.DUR = DUR;
window.renderAt = (t) => {
  // camera orbit: starts grazing the letters from the right side, sweeps around to front
  // continuous sweep that arrives with speed and slams to a stop on the impact
  const x = clamp(t / T_LOCK);
  const k = Math.pow(x, 1.35);
  const k2 = easeInOutSine(x);
  const tau = Math.max(0, t - T_LOCK);
  const overshoot = t >= T_LOCK ? -0.07 * Math.exp(-tau * 7) * Math.sin(tau * 20) : 0;
  const theta = lerp(THREE.MathUtils.degToRad(100), 0, k) + overshoot;
  const radius = lerp(3.4, 7.6, k2 * 0.4 + k * 0.6);
  const tgt = new THREE.Vector3(lerp(TEXT_W * 0.30, 0, k), lerp(0.45, TEXT_H * 0.5, k), 0);
  const camY = lerp(0.12, TEXT_H * 0.55, k);
  camera.position.set(tgt.x + Math.sin(theta) * radius, camY, tgt.z + Math.cos(theta) * radius);
  // after lock: slow push-in
  const post = clamp((t - T_LOCK) / (DUR - T_LOCK));
  camera.position.z -= post * 0.6;
  // impact shake
  const sh = Math.max(0, 1 - (t - T_LOCK) / 0.35) * (t >= T_LOCK ? 1 : 0);
  camera.position.x += Math.sin(t * 91) * 0.05 * sh;
  camera.position.y += Math.cos(t * 77) * 0.04 * sh;
  camera.lookAt(tgt);
  camera.rotateZ(lerp(-0.18, 0, k));   // dutch roll that straightens out

  // glow on the letter sides ramps up, spikes on impact
  const hit = t >= T_LOCK ? Math.exp(-(t - T_LOCK) * 5) : 0;
  sideMat.emissiveIntensity = lerp(0.12, 0.9, k) + hit * 1.6;
  reflSide.emissiveIntensity = sideMat.emissiveIntensity;
  bloom.strength = 0.7 + hit * 0.6;
  front.intensity = t >= T_LOCK ? 0.5 + hit * 1.5 : 0;
  renderer.toneMappingExposure = 1.0 + hit * 0.25;

  // light sweep across the front face after the lock
  const sw = clamp((t - T_LOCK - 0.05) / 0.9);
  sweep.intensity = sw > 0 && sw < 1 ? 22 * Math.sin(sw * Math.PI) : 0;
  sweep.position.set(lerp(-TEXT_W * 0.7, TEXT_W * 0.7, sw), TEXT_H * 0.6, 1.1);

  // embers drift upward; burst outward on impact
  for (let i = 0; i < N; i++) {
    const [x, y, z, sp, ph] = seeds[i];
    const burst = t >= T_LOCK ? (1 - Math.exp(-(t - T_LOCK) * 3)) * 1.2 : 0;
    ePos[i * 3] = x * (1 + burst * 0.15) + Math.sin(t * 0.8 + ph) * 0.15;
    ePos[i * 3 + 1] = (y + t * sp + burst * sp) % 6;
    ePos[i * 3 + 2] = z + Math.cos(t * 0.6 + ph) * 0.15;
  }
  eGeo.attributes.position.needsUpdate = true;

  composer.render();
};

window.READY = true;
</script>
</body>
</html>
